[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-hardle"
version = "0.1.0"
description = "Research code for Bayesian reasoning in a Hardle-style word-feedback environment"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Daowen Zhang" }]
dependencies = [
    "numpy>=1.24",
    "wordfreq==3.1.1",
    "streamlit>=1.39,<2",
]

[project.scripts]
bayesian-hardle = "bayesian_hardle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
